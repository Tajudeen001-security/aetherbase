services:
  - type: web
    name: kotahbase-api
    runtime: node
    plan: free
    buildCommand: cd services/api && npm install && npm run build
    startCommand: cd services/api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kotahbase-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: kotahbase
      - key: S3_PUBLIC_URL
        sync: false

databases:
  - name: kotahbase-db
    plan: free
    databaseName: kotahbase
    user: kotah
