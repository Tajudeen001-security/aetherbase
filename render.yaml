services:
  - type: web
    name: kotahbase-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd services/api && npm install
    startCommand: cd services/api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kotahbase-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: kotahbase-db
    plan: free
    databaseName: kotahbase
    user: kotah
