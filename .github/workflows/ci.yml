name: KotahBase CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check API
        run: npx tsc --noEmit -p services/api/tsconfig.json
      - name: Build dashboard
        run: npm run build --workspace=@kotahbase/dashboard
